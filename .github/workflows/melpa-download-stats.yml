name: MELPA Download Stats

on:
  schedule:
    - cron: '25 23 * * *'
      timezone: 'UTC'
  workflow_dispatch:

jobs:
  fetch-download-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package name
        id: pkg
        run: echo "package_name=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_OUTPUT"

      - name: Get actual run time
        id: run_time
        run: echo "run_time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      - name: Fetch MELPA download count
        id: fetch
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.package_name }}
        run: |
          python3 - <<'EOF'
          import json
          import os
          import urllib.request

          package_name = os.environ['PACKAGE_NAME']
          url = 'https://melpa.org/download_counts.json'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode('utf-8', 'ignore'))

          if not isinstance(data, dict) or package_name not in data:
              raise SystemExit(f'{package_name} not found in download_counts.json')

          download_count = data[package_name]
          if not isinstance(download_count, int) and not str(download_count).isdigit():
              raise SystemExit(f'Unexpected download count value: {download_count!r}')

          print(f'download_count={download_count}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'download_count={download_count}\n')
          EOF

      - name: Send download stats email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "${{ steps.pkg.outputs.package_name }} MELPA download count: ${{ steps.fetch.outputs.download_count }}"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          html_body: |
            <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;max-width:600px;margin:0 auto;">
              <div style="background-color:#1976d2;color:#ffffff;padding:20px;text-align:center;border-radius:8px 8px 0 0;">
                <h1 style="margin:0;font-size:24px;">MELPA Download Stats</h1>
                <p style="margin:8px 0 0 0;opacity:0.9;font-size:14px;">${{ steps.pkg.outputs.package_name }}</p>
              </div>
              <div style="background-color:#ffffff;padding:24px;border:1px solid #e0e0e0;border-top:none;border-radius:0 0 8px 8px;">
                <p style="color:#333;font-size:15px;line-height:1.6;">
                  Current download count:
                  <strong style="font-size:24px;color:#1976d2;">${{ steps.fetch.outputs.download_count }}</strong>
                </p>
                <p style="color:#777;font-size:13px;">Retrieved at ${{ steps.run_time.outputs.run_time }}.</p>
              </div>
            </div>

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "${{ steps.pkg.outputs.package_name }} MELPA download stats - FAILED"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          html_body: |
            <p>The daily MELPA download stats workflow failed.</p>
            <p>Execution time: ${{ steps.run_time.outputs.run_time }}.</p>
            <p>Please check GitHub Actions logs.</p>
