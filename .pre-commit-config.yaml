repos:
  - repo: local
    hooks:
      - id: emacs-check
        name: Emacs package lint and byte compile
        entry: >-
          emacs -Q --batch --directory .
          -l ci/precommit-checks.el
          --eval '(unless (and (fboundp (quote p/check-file))
                               (fboundp (quote p/dependency-errors)))
                    (error "pre-commit config error: precommit-checks.el did not load"))'
          --
        language: system
        files: \.el$
        pass_filenames: false
        verbose: true
